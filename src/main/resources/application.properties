spring.application.name=task-track
server.port=8081

# Use the variable from .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
JWT_SECRET=${JWT_SECRET}
# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Use the generic MySQL dialect (works for MySQL 5, 8, and above)


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
#

#logging.level.org.springframework.web=DEBUG
## If you want to see the exact payload (requires a bit more setup or a Filter)
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#JWT_SECRET=3p2Y9rG2M5xL8Q0nZ1vW7sE4dK6jH9mT2bN5fR8uQ1w=



#Disable Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
