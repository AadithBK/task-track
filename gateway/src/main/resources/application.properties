spring.application.name=api-gateway
server.port=9005

# Eureka Connectivity
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routing Configuration (New Namespace)
# Path for Task Service: http://localhost:9000/api/tasks/**
spring.cloud.gateway.server.webflux.routes[0].id=task-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://TASK-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**

# Path for Report Service: http://localhost:9000/api/reports/**
spring.cloud.gateway.server.webflux.routes[1].id=report-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://REPORT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/reports/**

# LOGGING: Vital for your first run
logging.level.org.springframework.cloud.gateway=TRACE


# Force the hostname to be localhost for local development
eureka.instance.hostname=localhost